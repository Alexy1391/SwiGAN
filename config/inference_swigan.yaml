dataset:
  # 2021-2025 for the rcp_8.5 Grand Est grid: the 12 months of 2021 supply the SWI history
  # that seeds the rollout (only `input_steps` of them are consumed), then 2022-2025 are
  # generated free-running. The map dimensions are read back from the checkpoint hparams.
  filepath: "Outputs/rcp_8.5/Bretagne/Bretagne_2022_2025.parquet"
  fill_missing_pixels: true
  # Must stay in the exact order used at training time: the channels are standardized by
  # position against the feats_mean / feats_std saved in train_dataset_statistics.npz.
  input_columns:
    - "evspsblpotAdjust"
    - "hussAdjust"
    - "prtotAdjust_max"
    - "prtotAdjust_sum"
    - "prtotAdjust_avg"
    - "rldsAdjust"
    - "rsdsAdjust"
    - "sfcWindAdjust"
    - "tasAdjust"
    - "tasmaxAdjust"
    - "tasminAdjust"
  target_column: "swi_u"
  x_dim_column: null
  y_dim_column: null
  starting_year: 2024
  starting_month: 1

model:
  # Point these at the run trained on the rcp_8.5 data. Checkpoints from the legacy 44x37
  # runs are not loadable here: different input channels and a different output crop.
  checkpoint_path: "swigan_bretagne_batch_size_64/2026-09-28_10-14-20/checkpoints/last.ckpt"
  train_dataset_statistics_path: "swigan_bretagne_batch_size_64/2026-09-28_10-14-20/train_dataset_statistics.npz"
  saving_path: "Outputs/inference_bretagne_rcp85"
  loss_fn: "l1"
  num_trajectories: 20
  num_trajectories_per_batch: 10
  noise_std: 1.0
  dtype: "float16"
  # Disperse on the state, not the noise. Path to the JSON written by
  # `python -m utils.dispersion_select` -- neutral-history members, per-member history shift
  # and the per-calendar-month offset, all chosen on windows that end before the forecast
  # starts -- or null for the unperturbed rollout. See utils/dispersion.py for why the noise
  # gain is the wrong knob and what these two do instead.
  dispersion: "Outputs/dispersion/bretagne_250ep_coherent/state_dispersion.json"
  # dispersion = output given in disperion_select.yaml/state_dispersion.json, null for no dispersion
  # Leave the generator's dropout active at inference (utils/dropout_probe.py): the protocol
  # every ensemble score in the reports used, and what a dispersion spec was selected under.
  # false is the original path.
  inference_dropout: true
  # Recalibrate the generator's BatchNorm running statistics on the training split before the
  # rollout (utils/batchnorm_recalibration.py). A checkpoint saved before 2026-09-23 stores
  # statistics dominated by the last training batches of its epoch, worth about +-0.05 of
  # rollout RMSE on a region the size of Bourgogne-Franche-Comte; one saved with
  # `batchnorm_recalibration` on already holds recalibrated ones and this recomputes them.
  # `filepath` must be the checkpoint's own training split: `dataset.filepath` of the config it
  # trained with. A `dispersion` spec selected on stored statistics was selected against a
  # different normalization. null keeps the stored statistics.
  batchnorm_recalibration:
    filepath: "Outputs/rcp_8.5/Bretagne/data_train.parquet"
    # The training batch size: the running variance averages within-batch variances.
    batch_size: 64
    num_passes: 1
    seed: 0
